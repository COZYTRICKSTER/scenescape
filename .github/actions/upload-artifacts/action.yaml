name: "Upload Logs and Reports"
description: "Renames logs and uploads logs and reports as artifacts"
runs:
  using: "composite"
  steps:
    - name: Rename logs to remove colons
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r -d '' file; do
          dir="$(dirname "$file")"
          base="$(basename "$file")"
          safe="$(printf '%s' "$base" | tr ':"<>|*?' '--------')"
          if [[ "$base" != "$safe" ]]; then
            mv -f -- "$file" "$dir/$safe"
          fi
        done < <(find . -type f -path '*/test_data/*' -name '*.log' -print0)

    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-${{ github.job }}
        path: |
          tests/**/test_reports/**/*.html
          tests/**/test_reports/**/*.xml

    - name: Upload Test Logs
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ github.job }}
        path: |
          **/test_data/**/*.log
