name: "Setup Environment"
description: "Initializes environment for tests"
runs:
  using: "composite"
  steps:
    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
      with:
        python-version: "3.13"

    - name: Cache Python Virtualenv
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.github/resources/requirements.txt') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}


    - name: Initialize secrets and certificates (idempotent)
      run: |
        # Generates secrets and certificates required by tests.
        # This is the same target your Makefile already provides.
        make init-secrets
      shell: bash

    - name: Build Docker base image
      run: |
        # Produces the scenescape-common-base image required by service/test images.
        # This target is defined in your top-level Makefile.
        make build-common
      shell: bash
