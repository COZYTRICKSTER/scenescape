name: "[Tests] All Tests"
run-name: "[Tests] All Tests"

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2:00 AM UTC
  workflow_dispatch:
    inputs:
      cleanup:
        description: "Cleanup before running ALL tests"
        required: false
        default: false
        type: boolean
      timeout:
        description: "Timeout for the job in minutes"
        required: false
        type: number
        default: 180
  push:
    branches:
      - main
      - release-*

  # Trigger workflow when enqueued to a merge group
  # (must be under 'on')
  merge_group: {}

# Only run at most 1 workflow concurrently per PR or per branch to keep costs down
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  SUPASS: ${{ secrets.SUPASS }}
  BUILD_TYPE: DAILY

permissions:
  contents: read

jobs:
  run-all-tests:
    name: "Run All Tests"
    runs-on: [self-hosted]
    timeout-minutes: ${{ fromJSON(inputs.timeout || '180') }}
    steps:
      - name: "Remove all Docker images"
        if: ${{ github.event.inputs.cleanup == 'true' }}
        run: |
          docker ps -aq | xargs -r docker stop || true
          docker volume ls -q | xargs -r docker volume rm || true
          docker system prune -af --volumes

      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: "Setup Python"
        id: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: "Cache Python Virtualenv"
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('.github/resources/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}

      - name: "Run Secrets and Certificates Initialization"
        run: |
          git clean -fdx
          make clean-all
          make -C tools/certificates clean
          make init-secrets

      - name: "Build scene_common"
        run: |
          make -C scene_common

      - name: "Run All Tests"
        run: |
          python3 -m venv venv
          source $PWD/venv/bin/activate
          echo "$PWD/venv/bin" >> $GITHUB_PATH
          pip install -r .github/resources/requirements.txt
          make run_tests

      - name: Rename logs to remove colons
        if: always()
        run: |
          set +e # Ignore errors if no logs are found
          find . -type f -path "**/test_data/*.log" | while read -r file; do
            newfile="$(dirname "$file")/$(basename "$file" | tr ':' '-')"
            if [ "$file" != "$newfile" ]; then
              mv "$file" "$newfile"
            fi
          done
          exit 0

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: tests-reports
          path: |
            tests/

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: tests-logs
          path: |
            **/test_data/**/*.log

      - name: "Stop all running Docker containers"
        if: always()
        run: |
          docker ps -aq | xargs docker rm -f  || true

      - name: "Remove all volumes used in test"
        if: always()
        run: |
          docker volume ls -q | xargs docker volume rm -f  || true

      - name: "Clean runner"
        if: always()
        run: |
          sudo rm -rf * || true

  summarize:
    name: "Summarize Test Results"
    needs: run-all-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Test Reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: tests-reports
          path: results

      - name: "Debug: List downloaded files"
        run: |
          echo "Listing files in results:"
          find results -type f

      - name: Generate Summary
        run: |
          echo "## 📊 Test Summary" >> $GITHUB_STEP_SUMMARY

          total_tests=0
          total_failures=0
          total_errors=0
          total_skipped=0

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ❌ Failed / 💥 Errored / ⚠️ Skipped Tests" >> $GITHUB_STEP_SUMMARY

          for file in $(find results -type f -name "*.xml"); do
            tests=$(xmllint --xpath "string(//testsuite/@tests)" "$file" 2>/dev/null || echo 0)
            failures=$(xmllint --xpath "string(//testsuite/@failures)" "$file" 2>/dev/null || echo 0)
            errors=$(xmllint --xpath "string(//testsuite/@errors)" "$file" 2>/dev/null || echo 0)
            skipped=$(xmllint --xpath "string(//testsuite/@skipped)" "$file" 2>/dev/null || echo 0)

            total_tests=$((total_tests + tests))
            total_failures=$((total_failures + failures))
            total_errors=$((total_errors + errors))
            total_skipped=$((total_skipped + skipped))

            xmllint --xpath '//testcase[failure or error or skipped]' "$file" 2>/dev/null \
              | xmllint --format - \
              | grep "<testcase" \
              | sed -E 's/.*classname="([^"]*)" name="([^"]*)".*/- \1::\2/' >> $GITHUB_STEP_SUMMARY || true
          done

          total_passed=$((total_tests - total_failures - total_errors - total_skipped))

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Totals" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Passed: $total_passed" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: $total_failures" >> $GITHUB_STEP_SUMMARY
          echo "- 💥 Errors: $total_errors" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Skipped: $total_skipped" >> $GITHUB_STEP_SUMMARY
          echo "- 📋 Total: $total_tests" >> $GITHUB_STEP_SUMMARY

          if [ "$total_failures" -gt 0 ] || [ "$total_errors" -gt 0 ]; then
            echo "❌ Some tests failed or errored. Failing job."
            exit 1
          fi
